name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    name: "compile check (perl ${{ matrix.perl }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: [ '5.26', '5.32', '5.36', '5.38', '5.40' ]
    steps:
      - uses: actions/checkout@v4

      - name: set up perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: perl version
        run: perl -V:version -V:archname

      # CGI.pm left the core in 5.22 and GD was never in it.  Without
      # them the compile check reports "optional module missing" and walks
      # past the whole FML/CGI subsystem -- 16 modules that then get no
      # syntax check at all.  Install them so the skip list stays short
      # enough to read.
      - name: install the modules fml8 needs but perl no longer ships
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgd-dev
          command -v cpanm >/dev/null || curl -sL https://cpanmin.us | perl - App::cpanminus
          cpanm --notest --quiet CGI GD

      # Every module under fml/lib must at least compile.  The bundled
      # cpan/lib is appended, never prepended: the shipped File::Spec is
      # 0.7 and lacks splitdir()/splitpath() that fml8 calls, so putting
      # it first shadows the core one and breaks at runtime.
      - name: compile every module
        run: |
          set -u
          fail=0
          skipped=""
          for f in $(find fml/lib -name '*.pm' | sort); do
            if ! out=$(perl -Ifml/lib -I. -Icpan/lib -Iimg/lib -c "$f" 2>&1); then
              case "$out" in
                *"Can't locate "*)
                  echo "SKIP (optional module missing): $f"
                  echo "$out" | head -1
                  skipped="$skipped $f"
                  ;;
                *)
                  echo "FAIL: $f"
                  echo "$out"
                  echo "::error file=$f::$(echo "$out" | head -1)"
                  fail=$((fail+1))
                  ;;
              esac
            fi
          done
          # A skip is a module nobody compiled.  Say which, so the blind
          # spot cannot grow quietly.
          if [ -n "$skipped" ]; then
            echo "::warning::not compile checked:$skipped"
          fi
          echo "failed: $fail"
          test "$fail" -eq 0

  test:
    name: "unit tests (perl ${{ matrix.perl }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: [ '5.26', '5.36', '5.40' ]
    steps:
      - uses: actions/checkout@v4

      - name: set up perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: run t/*.t
        run: prove -v t/

  removed-syntax:
    name: "guard against perl syntax removed upstream"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # These constructs are fatal on modern perl.  They keep creeping
      # back in from the fml4 era, so fail the build on sight.
      - name: scan for defined(@array) / defined(%hash) / $*
        run: |
          set -u
          rc=0
          if grep -rnE 'defined\s*\(?\s*[@%][A-Za-z_$]' \
               --include='*.pm' --include='*.pl' --include='*.t' fml/ cpan/lib/ t/ 2>/dev/null \
               | grep -vE ':[[:space:]]*#'; then
            echo "::error::defined(@array)/defined(%hash) is fatal since perl 5.22"
            rc=1
          fi
          if grep -rnE '(^|[^$\\])\$\*\s*=' --include='*.pm' --include='*.pl' fml/ 2>/dev/null \
               | grep -vE ':[[:space:]]*#'; then
            echo "::error::\$* was removed in perl 5.30"
            rc=1
          fi
          exit $rc
